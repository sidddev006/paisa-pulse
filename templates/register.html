{% extends "layout.html" %}

{% block title %}Create Free Account - Paisa Pulse{% endblock %}

{% block content %}
<div class="min-h-[72vh] flex items-center justify-center px-4 sm:px-6">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/50 p-6 sm:p-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-brand-50 border border-brand-100 flex items-center justify-center text-brand-600 text-2xl mx-auto mb-4 glow-brand">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1 class="font-heading text-2xl sm:text-3xl font-extrabold text-slate-900">Create Account</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Join Paisa Pulse to take control of your financial future</p>
        </div>

        <form action="{{ url_for('register') }}" method="post" id="register-form" class="space-y-5">
            
            <!-- Username -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5 ml-1">Username</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-600">
                        <i class="bi bi-at"></i>
                    </div>
                    <input type="text" name="username" value="{{ username or '' }}" required autofocus autocomplete="username" minlength="3" placeholder="Choose a unique username" 
                           class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-4 focus:ring-brand-500/10 focus:border-brand-600 outline-none transition-all">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5 ml-1">Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-600">
                        <i class="bi bi-key-fill"></i>
                    </div>
                    <input type="password" name="password" id="reg-password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" 
                           class="w-full pl-10 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-4 focus:ring-brand-500/10 focus:border-brand-600 outline-none transition-all">
                    <button type="button" onclick="togglePassword('reg-password', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5 ml-1">Confirm Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-brand-600">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <input type="password" name="pass_confirm" id="reg-confirm" required minlength="6" autocomplete="new-password" placeholder="Repeat your password" 
                           class="w-full pl-10 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:bg-white focus:ring-4 focus:ring-brand-500/10 focus:border-brand-600 outline-none transition-all">
                    <button type="button" onclick="togglePassword('reg-confirm', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" class="w-full py-3.5 px-6 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-2xl shadow-xl shadow-brand-500/25 hover:shadow-2xl transition-all hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2">
                    <span>Create My Account</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </div>

        </form>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs sm:text-sm text-slate-500">
                Already have an account? 
                <a href="{{ url_for('login') }}" class="font-bold text-brand-600 hover:text-brand-700 hover:underline">
                    Sign in instead
                </a>
            </p>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }
</script>
{% endblock %}
