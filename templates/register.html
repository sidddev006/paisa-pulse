{% extends "layout.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] px-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 border border-slate-100">
        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="brand-font text-3xl font-extrabold text-slate-800">Create Account</h2>
            <p class="text-slate-500 mt-2">Join Paisa Pulse to start tracking your habits</p>
        </div>

        <form action="/register" method="post" class="space-y-6">
            <!-- Username -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Username</label>
                <div class="relative">
                    <input autocomplete="off" autofocus 
                           class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-slate-800 placeholder:text-slate-400" 
                           placeholder="Enter a unique username" 
                           name="username" 
                           type="text"
                           required>
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Password</label>
                <input class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-slate-800 placeholder:text-slate-400" 
                       name="password" 
                       placeholder="••••••••" 
                       type="password" 
                       required 
                       autocomplete="off">
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Confirm Password</label>
                <input class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-slate-800 placeholder:text-slate-400" 
                       name="pass_confirm" 
                       placeholder="••••••••" 
                       type="password" 
                       required 
                       autocomplete="off">
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-[0.98]" 
                        type="submit">
                    Create My Account
                </button>
            </div>
        </form>

        <!-- Footer Link -->
        <div class="mt-8 text-center">
            <p class="text-sm text-slate-500">
                Already have an account? 
                <a href="/login" class="text-blue-600 font-semibold hover:underline">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
