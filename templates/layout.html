<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Paisa Pulse</title>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">
        
        <!-- Premium Typography -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

        <!-- Modern UI Frameworks -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.tailwindcss.com"></script>
        
        <!-- Chart.js for Data Visualization -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <style>
            body {
                font-family: 'Inter', sans-serif;
                background-color: #f8fafc; /* Professional light slate background */
            }
            .brand-font {
                font-family: 'Montserrat', sans-serif;
                letter-spacing: -0.5px;
            }
            /* Custom Glassmorphism for Navbar */
            .glass-nav {
                background: rgba(255, 255, 255, 0.85);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            }
            .nav-link {
                font-weight: 500;
                color: #475569 !important;
                transition: all 0.2s ease;
            }
            .nav-link:hover {
                color: #2563eb !important; /* Blue-600 */
                background-color: rgba(37, 99, 235, 0.05);
                border-radius: 8px;
            }
        </style>
    </head>
    <body class="min-h-screen">
        <!-- Sticky Glass Navbar (Visible on every page) -->
        <nav class="navbar navbar-expand-md glass-nav sticky-top py-3">
            <div class="container mx-auto px-4">
                <a class="navbar-brand flex items-center gap-2" href="/">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-200">
                        <span class="text-white font-bold text-sm">P</span>
                    </div>
                    <span class="brand-font font-extrabold text-xl text-slate-800">PAISA PULSE</span>
                </a>
                
                <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler border-0 shadow-none" data-bs-target="#navbar" data-bs-toggle="collapse" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbar">
                    {% if session["user_id"] %}
                        <!-- Main Menu for Authenticated Users -->
                        <ul class="navbar-nav me-auto mb-2 mb-md-0 gap-1 lg:ml-8">
                            <li class="nav-item">
                                <a class="nav-link px-3 py-2" href="/dashboard">Dashboard</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link px-3 py-2" href="/add">Add Transaction</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link px-3 py-2" href="/history">History</a>
                            </li>
                        </ul>
                        <!-- User Actions -->
                        <ul class="navbar-nav ms-auto items-center">
                            <li class="nav-item">
                                <a class="px-5 py-2 text-sm font-bold text-white bg-slate-800 hover:bg-slate-900 rounded-full transition-all no-underline shadow-sm" href="/logout">
                                    Log Out
                                </a>
                            </li>
                        </ul>
                    {% else %}
                        <!-- Auth Actions for Guests -->
                        <ul class="navbar-nav ms-auto items-center gap-3">
                            <li class="nav-item">
                                <a class="nav-link px-3 py-2" href="/login">Log In</a>
                            </li>
                            <li class="nav-item">
                                <a class="px-5 py-2 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-full transition-all no-underline shadow-lg shadow-blue-200" href="/register">
                                    Register
                                </a>
                            </li>
                        </ul>
                    {% endif %}
                </div>
            </div>
        </nav>

        <!-- Dynamic Flash Messaging -->
        {% if get_flashed_messages() %}
            <div class="container mx-auto px-4 mt-6">
                <div class="alert alert-primary bg-blue-50 border-blue-100 text-blue-700 rounded-2xl shadow-sm text-center py-4 brand-font font-bold" role="alert">
                    {{ get_flashed_messages() | join(" ") }}
                </div>
            </div>
        {% endif %}

        <!-- Main Dynamic Content Block -->
        <main class="py-8">
            {% block content %}{% endblock %}
        </main>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
