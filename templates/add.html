{% extends "layout.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh] px-4">
    <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 border border-slate-100">
        <!-- Header -->
        <div class="text-center mb-10">
            <h2 class="brand-font text-3xl font-extrabold text-slate-800">New Transaction</h2>
            <p class="text-slate-500 mt-2">Log your daily income or expenses to stay on track.</p>
        </div>

        <form action="/add" method="post" class="space-y-6">
            <!-- Transaction Type Selection -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-3 ml-1 text-center">What kind of transaction?</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="type" value="income" class="peer hidden" required>
                        <div class="text-center py-3 rounded-2xl border-2 border-slate-100 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 font-bold transition-all text-slate-500">
                            Income
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="type" value="expense" class="peer hidden" required>
                        <div class="text-center py-3 rounded-2xl border-2 border-slate-100 peer-checked:border-rose-500 peer-checked:bg-rose-50 peer-checked:text-rose-700 font-bold transition-all text-slate-500">
                            Expense
                        </div>
                    </label>
                </div>
            </div>

            <!-- Categories (Dynamic) -->
            <div id="category-wrapper" class="hidden animate-in fade-in slide-in-from-top-2">
                <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Category</label>
                
                <select name="category" id="income-categories" class="hidden w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800">
                    <option disabled selected>Select income source</option>
                    <option value="salary">Salary</option>
                    <option value="freelance">Freelance</option>
                    <option value="gift">Gift</option>
                    <option value="investment">Investment</option>
                    <option value="other">Other</option>
                </select>

                <select name="category" id="expense-categories" class="hidden w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800">
                    <option disabled selected>Select expense category</option>
                    <option value="food">Food</option>
                    <option value="rent">Rent</option>
                    <option value="transport">Transport</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="shopping">Shopping</option>
                    <option value="health">Health</option>
                    <option value="education">Education</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Amount -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Amount</label>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold group-focus-within:text-blue-500 transition-colors">₹</span>
                        <input type="number" name="amount" step="0.01"
                               class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-slate-800 font-bold" 
                               placeholder="0.00" required>
                    </div>
                </div>

                <!-- Date -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Date</label>
                    <input type="date" name="date"
                           class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800">
                </div>
            </div>

            <!-- Note -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Note (Optional)</label>
                <input type="text" name="note" placeholder="e.g. Weekly groceries or Client project"
                       class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 placeholder:text-slate-400">
            </div>

            <!-- Submit -->
            <div class="pt-4">
                <button type="submit" class="w-full py-4 px-4 bg-slate-900 hover:bg-black text-white font-bold rounded-2xl shadow-xl shadow-slate-200 transition-all active:scale-[0.98]">
                    Add to Pulse
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Initialize date to today
    document.querySelector('input[name="date"]').valueAsDate = new Date();

    // Enhanced toggle logic
    const typeInputs = document.querySelectorAll('input[name="type"]');
    const wrapper = document.getElementById('category-wrapper');
    const incomeCats = document.getElementById('income-categories');
    const expenseCats = document.getElementById('expense-categories');

    typeInputs.forEach(input => {
        input.addEventListener('change', function() {
            wrapper.classList.remove('hidden');
            if (this.value === 'income') {
                incomeCats.classList.remove('hidden');
                incomeCats.setAttribute('required', '');
                expenseCats.classList.add('hidden');
                expenseCats.removeAttribute('required');
            } else {
                incomeCats.classList.add('hidden');
                incomeCats.removeAttribute('required');
                expenseCats.classList.remove('hidden');
                expenseCats.setAttribute('required', '');
            }
        });
    });
</script>
{% endblock %}
